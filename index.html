<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a1a1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mis Cafés">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Mis Cafés</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f7f5f2;
      --surface: #ffffff;
      --border: #e8e4de;
      --border-strong: #ccc7be;
      --text: #1a1a1a;
      --text-muted: #888;
      --text-secondary: #555;
      --accent: #3a3a3a;
      --accent-light: #f0ede8;
      --danger: #c0392b;
      --success-bg: #eef7ee;
      --success-text: #2d7a2d;
      --warning-bg: #fff8e6;
      --warning-text: #9a6800;
      --radius: 12px;
      --star: #d4960a;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      max-width: 480px;
      margin: 0 auto;
    }

    header {
      background: var(--surface);
      border-bottom: 0.5px solid var(--border);
      padding: 1rem 1.25rem 0.75rem;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.3px; }
    header p { font-size: 13px; color: var(--text-muted); margin-top: 2px; }

    .filtros {
      display: flex;
      gap: 6px;
      padding: 10px 1rem;
      overflow-x: auto;
      background: var(--surface);
      border-bottom: 0.5px solid var(--border);
      scrollbar-width: none;
    }
    .filtros::-webkit-scrollbar { display: none; }

    .filtro {
      font-size: 12px;
      padding: 5px 12px;
      border-radius: 20px;
      border: 0.5px solid var(--border-strong);
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      white-space: nowrap;
      font-family: inherit;
      transition: all 0.15s;
    }
    .filtro.activo {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .lista { padding: 0.75rem 0 5rem; }

    .cafe-card {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
      margin: 0 1rem 0.75rem;
    }

    .cafe-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 6px;
    }

    .cafe-nombre { font-size: 15px; font-weight: 600; color: var(--text); }
    .cafe-origen { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    .badges { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
    .badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 6px;
      white-space: nowrap;
      font-weight: 500;
    }
    .badge-natural { background: #fff0e6; color: #b05000; }
    .badge-lavado { background: #e6f0ff; color: #1a4fa0; }
    .badge-honey { background: #fff8e0; color: #9a6800; }
    .badge-otro { background: var(--accent-light); color: var(--accent); }
    .badge-pts { background: var(--success-bg); color: var(--success-text); }
    .badge-nueva { background: var(--warning-bg); color: var(--warning-text); }

    .cafe-notas {
      font-size: 13px;
      color: var(--text-secondary);
      margin: 6px 0;
      line-height: 1.4;
    }

    .estrellas {
      display: flex;
      gap: 3px;
      margin-top: 8px;
    }
    .estrella {
      font-size: 18px;
      cursor: pointer;
      color: var(--border-strong);
      transition: color 0.1s;
      line-height: 1;
      user-select: none;
    }
    .estrella.on { color: var(--star); }

    .btn-notas {
      background: none;
      border: none;
      font-size: 12px;
      color: #555;
      cursor: pointer;
      padding: 4px 0;
      margin-top: 4px;
      font-family: inherit;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .notas-ext {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 6px;
      font-style: italic;
      line-height: 1.5;
      display: none;
      padding: 8px;
      background: var(--bg);
      border-radius: 8px;
    }
    .notas-ext.visible { display: block; }

    .cafe-meta {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 0.5px solid var(--border);
      align-items: center;
    }

    .meta-item {
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .btn-eliminar {
      margin-left: auto;
      background: none;
      border: none;
      font-size: 14px;
      color: var(--text-muted);
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
      font-family: inherit;
    }
    .btn-eliminar:hover { color: var(--danger); }

    .fab {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 2rem);
      max-width: 440px;
    }
    .fab button {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      box-shadow: 0 4px 16px rgba(0,0,0,0.18);
    }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 100;
      align-items: flex-end;
    }
    .overlay.visible { display: flex; }

    .sheet {
      background: var(--surface);
      border-radius: 20px 20px 0 0;
      padding: 1.25rem;
      width: 100%;
      max-height: 90dvh;
      overflow-y: auto;
    }

    .sheet-handle {
      width: 36px;
      height: 4px;
      background: var(--border-strong);
      border-radius: 2px;
      margin: 0 auto 1rem;
    }

    .sheet h2 { font-size: 16px; font-weight: 600; margin-bottom: 1rem; }

    .form-group { margin-bottom: 12px; }
    .form-group label {
      font-size: 12px;
      color: var(--text-secondary);
      display: block;
      margin-bottom: 4px;
      font-weight: 500;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      font-size: 14px;
      padding: 10px 12px;
      border: 0.5px solid var(--border-strong);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
      appearance: none;
    }
    .form-group textarea { height: 72px; resize: none; }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    .estrellas-form { display: flex; gap: 8px; margin-top: 4px; }
    .estrellas-form span {
      font-size: 26px;
      cursor: pointer;
      color: var(--border-strong);
      user-select: none;
    }
    .estrellas-form span.on { color: var(--star); }

    .form-error {
      color: var(--danger);
      font-size: 13px;
      margin-bottom: 8px;
      display: none;
    }

    .form-btns { display: flex; gap: 8px; margin-top: 1rem; }
    .form-btns button {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-cancel {
      background: transparent;
      border: 0.5px solid var(--border-strong);
      color: var(--text);
    }
    .btn-save {
      background: var(--accent);
      border: none;
      color: #fff;
    }

    .empty {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
      font-size: 14px;
    }
    .empty span { font-size: 40px; display: block; margin-bottom: 8px; }

    .install-banner {
      margin: 0 1rem 0.75rem;
      background: var(--warning-bg);
      border: 0.5px solid #f0d070;
      border-radius: var(--radius);
      padding: 0.75rem 1rem;
      font-size: 13px;
      color: var(--warning-text);
      display: none;
      align-items: center;
      gap: 8px;
    }
    .install-banner button {
      margin-left: auto;
      background: var(--warning-text);
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
    }
  </style>
</head>
<body>

<header>
  <h1>☕ Mis cafés</h1>
  <p id="subtitulo">Cargando...</p>
</header>

<div class="filtros">
  <button class="filtro activo" onclick="setFiltro('todos',this)">Todos</button>
  <button class="filtro" onclick="setFiltro('Natural',this)">Natural</button>
  <button class="filtro" onclick="setFiltro('Lavado',this)">Lavado</button>
  <button class="filtro" onclick="setFiltro('Guatemala',this)">Guatemala</button>
  <button class="filtro" onclick="setFiltro('Colombia',this)">Colombia</button>
  <button class="filtro" onclick="setFiltro('Perú',this)">Perú</button>
</div>

<div class="lista">
  <div class="install-banner" id="install-banner">
    📲 Instalá la app en tu celular
    <button onclick="instalar()">Instalar</button>
  </div>
  <div id="lista-cafes"></div>
</div>

<div class="fab" id="fab">
  <button onclick="abrirForm()">+ Agregar café</button>
</div>

<div class="overlay" id="overlay" onclick="cerrarSiOverlay(event)">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2>Agregar café</h2>
    <div class="form-group">
      <label>Nombre / finca *</label>
      <input type="text" id="f-nombre" placeholder="Counisa, El Paraíso...">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Origen</label>
        <input type="text" id="f-origen" placeholder="Guatemala">
      </div>
      <div class="form-group">
        <label>Proceso</label>
        <select id="f-proceso">
          <option value="">—</option>
          <option>Natural</option>
          <option>Lavado</option>
          <option>Honey</option>
          <option>Anaeróbico</option>
          <option>Experimental</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>Tostador</label>
      <input type="text" id="f-tostador" placeholder="Puerto Blest...">
    </div>
    <div class="form-group">
      <label>Notas de cata</label>
      <input type="text" id="f-notas" placeholder="Frambuesa, caramelo, hibiscus...">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Puntaje SCA</label>
        <input type="number" id="f-pts" placeholder="84.25" step="0.25" min="0" max="100">
      </div>
      <div class="form-group">
        <label>Método</label>
        <select id="f-metodo">
          <option value="">—</option>
          <option>Espresso</option>
          <option>V60</option>
          <option>Chemex</option>
          <option>Aeropress</option>
          <option>Cupping</option>
          <option>Moka</option>
          <option>Cold brew</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>Mis notas</label>
      <textarea id="f-misnotas" placeholder="Parámetros, impresión, qué cambiaría..."></textarea>
    </div>
    <div class="form-group">
      <label>Mi puntaje</label>
      <div class="estrellas-form" id="estrellas-form">
        <span data-v="1">☆</span>
        <span data-v="2">☆</span>
        <span data-v="3">☆</span>
        <span data-v="4">☆</span>
        <span data-v="5">☆</span>
      </div>
    </div>
    <div class="form-error" id="form-error"></div>
    <div class="form-btns">
      <button class="btn-cancel" onclick="cerrarForm()">Cancelar</button>
      <button class="btn-save" onclick="guardarCafe()">Guardar</button>
    </div>
  </div>
</div>

<script>
const KEY = 'mis-cafes-v1';
let cafes = [];
let puntajeForm = 0;
let filtroActivo = 'todos';
let deferredPrompt = null;

const BASE = [
  {id:1, nombre:'Counisa', origen:'Guatemala', proceso:'Natural', tostador:'Puerto Blest', notas:'Frambuesa, fresa, mermelada de frutos rojos, canela, nuez moscada, hibiscus', pts:84.25, metodo:'Espresso', misnotas:'Ratio 2:1, 18g → 36g. Punto de molienda en exploración entre click 12-14 del Niche. Amargo en 12, ácido en 14. Próxima prueba: click 13.', puntaje:0, fecha:'5 sep. 2026', nueva:false},
  {id:2, nombre:'Fincas de Guadalupe', origen:'Colombia', proceso:'Lavado', tostador:'Puerto Blest', notas:'Durazno, miel, vainilla, té negro', pts:83.5, metodo:'Espresso', misnotas:'Varietal Castillo. Lavado muy suave — con leche se perdía demasiado. No repetir para espresso.', puntaje:3, fecha:'5 sep. 2026', nueva:false},
  {id:3, nombre:'El Peñón de la Fe', origen:'Guatemala', proceso:'Natural', tostador:'Puerto Blest', notas:'Frambuesa, chocolate blanco, manteca, pecano, frutilla, clavo, membrillo', pts:84.75, metodo:'', misnotas:'', puntaje:0, fecha:'5 sep. 2026', nueva:true},
  {id:4, nombre:'Café Monteverde', origen:'Perú', proceso:'Natural', tostador:'Puerto Blest', notas:'Frambuesa, frutillas, rosas, miel, crema, almendra', pts:84, metodo:'', misnotas:'¡Me encantó! Fuerte sabor a frutos rojos. El mejor hasta ahora.', puntaje:5, fecha:'5 sep. 2026', nueva:false},
  {id:5, nombre:'Timbuyacu', origen:'Perú', proceso:'Lavado', tostador:'Puerto Blest', notas:'Durazno, frutas de hueso, praliné, caramelo, vainilla', pts:83.5, metodo:'', misnotas:'', puntaje:0, fecha:'5 sep. 2026', nueva:true},
  {id:6, nombre:'Comité Vituya', origen:'Perú', proceso:'Lavado', tostador:'Puerto Blest', notas:'Hibiscus, frambuesa, fresa, lúpulo, caramelo, mandarina', pts:86, metodo:'', misnotas:'', puntaje:0, fecha:'5 sep. 2026', nueva:true},
];

function cargar() {
  try {
    const s = localStorage.getItem(KEY);
    cafes = s ? JSON.parse(s) : BASE;
  } catch(e) { cafes = BASE; }
  render();
}

function guardar() {
  try { localStorage.setItem(KEY, JSON.stringify(cafes)); } catch(e) {}
}

function badgeProceso(p) {
  if (!p) return '';
  const cls = p === 'Natural' ? 'badge-natural' : p === 'Lavado' ? 'badge-lavado' : p === 'Honey' ? 'badge-honey' : 'badge-otro';
  return `<span class="badge ${cls}">${p}</span>`;
}

function cafesFiltrados() {
  if (filtroActivo === 'todos') return cafes;
  return cafes.filter(c => c.proceso === filtroActivo || c.origen === filtroActivo);
}

function setFiltro(f, btn) {
  filtroActivo = f;
  document.querySelectorAll('.filtro').forEach(b => b.classList.remove('activo'));
  btn.classList.add('activo');
  render();
}

function render() {
  const lista = document.getElementById('lista-cafes');
  const vis = cafesFiltrados();
  const total = cafes.length;
  document.getElementById('subtitulo').textContent = total + ' café' + (total !== 1 ? 's' : '') + ' guardado' + (total !== 1 ? 's' : '');

  if (vis.length === 0) {
    lista.innerHTML = '<div class="empty"><span>☕</span>Sin cafés en esta categoría.</div>';
    return;
  }

  const sorted = [...vis].sort((a, b) => (b.pts || 0) - (a.pts || 0));

  lista.innerHTML = sorted.map(c => {
    const idx = cafes.indexOf(c);
    return `
      <div class="cafe-card">
        <div class="cafe-top">
          <div>
            <div class="cafe-nombre">${c.nombre}</div>
            <div class="cafe-origen">${[c.tostador, c.origen].filter(Boolean).join(' · ')}</div>
          </div>
          <div class="badges">
            ${c.nueva ? '<span class="badge badge-nueva">nueva</span>' : ''}
            ${c.pts ? `<span class="badge badge-pts">${c.pts}</span>` : ''}
            ${badgeProceso(c.proceso)}
          </div>
        </div>
        ${c.notas ? `<div class="cafe-notas">✦ ${c.notas}</div>` : ''}
        <div class="estrellas">
          ${[1,2,3,4,5].map(v => `<span class="estrella${c.puntaje >= v ? ' on' : ''}" onclick="setPuntaje(${idx},${v})">${c.puntaje >= v ? '★' : '☆'}</span>`).join('')}
        </div>
        ${c.misnotas ? `
          <button class="btn-notas" onclick="toggleNotas('n${c.id}', this)">Ver mis notas</button>
          <div class="notas-ext" id="n${c.id}">${c.misnotas}</div>
        ` : ''}
        <div class="cafe-meta">
          ${c.metodo ? `<span class="meta-item">☕ ${c.metodo}</span>` : ''}
          ${c.fecha ? `<span class="meta-item">📅 ${c.fecha}</span>` : ''}
          <button class="btn-eliminar" onclick="eliminar(${idx})" title="Eliminar">✕</button>
        </div>
      </div>
    `;
  }).join('');
}

function toggleNotas(id, btn) {
  const el = document.getElementById(id);
  el.classList.toggle('visible');
  btn.textContent = el.classList.contains('visible') ? 'Ocultar notas' : 'Ver mis notas';
}

function setPuntaje(i, v) {
  cafes[i].puntaje = cafes[i].puntaje === v ? 0 : v;
  cafes[i].nueva = false;
  guardar(); render();
}

function eliminar(i) {
  if (!confirm('¿Eliminar este café del registro?')) return;
  cafes.splice(i, 1);
  guardar(); render();
}

function abrirForm() {
  document.getElementById('overlay').classList.add('visible');
  document.getElementById('f-nombre').focus();
}

function cerrarForm() {
  document.getElementById('overlay').classList.remove('visible');
  limpiarForm();
}

function cerrarSiOverlay(e) {
  if (e.target === document.getElementById('overlay')) cerrarForm();
}

function limpiarForm() {
  ['f-nombre','f-origen','f-tostador','f-notas','f-misnotas'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
  document.getElementById('f-proceso').value = '';
  document.getElementById('f-metodo').value = '';
  document.getElementById('f-pts').value = '';
  puntajeForm = 0;
  actualizarEstrellasForm(0);
  document.getElementById('form-error').style.display = 'none';
}

function actualizarEstrellasForm(v) {
  document.querySelectorAll('#estrellas-form span').forEach(s => {
    const sv = parseInt(s.dataset.v);
    s.textContent = sv <= v ? '★' : '☆';
    s.classList.toggle('on', sv <= v);
  });
}

document.querySelectorAll('#estrellas-form span').forEach(s => {
  s.addEventListener('click', () => {
    const v = parseInt(s.dataset.v);
    puntajeForm = puntajeForm === v ? 0 : v;
    actualizarEstrellasForm(puntajeForm);
  });
});

function guardarCafe() {
  const nombre = document.getElementById('f-nombre').value.trim();
  const errEl = document.getElementById('form-error');
  if (!nombre) {
    errEl.textContent = 'El nombre es obligatorio.';
    errEl.style.display = 'block';
    return;
  }
  errEl.style.display = 'none';
  cafes.unshift({
    id: Date.now(),
    nombre,
    origen: document.getElementById('f-origen').value.trim(),
    proceso: document.getElementById('f-proceso').value,
    tostador: document.getElementById('f-tostador').value.trim(),
    notas: document.getElementById('f-notas').value.trim(),
    pts: parseFloat(document.getElementById('f-pts').value) || null,
    metodo: document.getElementById('f-metodo').value,
    misnotas: document.getElementById('f-misnotas').value.trim(),
    puntaje: puntajeForm,
    fecha: new Date().toLocaleDateString('es-AR', {day:'numeric', month:'short', year:'numeric'}),
    nueva: false
  });
  guardar(); cerrarForm(); render();
}

// PWA install
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  const banner = document.getElementById('install-banner');
  banner.style.display = 'flex';
});

function instalar() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(() => {
    deferredPrompt = null;
    document.getElementById('install-banner').style.display = 'none';
  });
}

window.addEventListener('appinstalled', () => {
  document.getElementById('install-banner').style.display = 'none';
});

// Service Worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/registro_de_caf-/sw.js');
}

cargar();
</script>
</body>
</html>
